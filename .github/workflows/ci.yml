name: Identity Service CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify-build-publish:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify with Maven
        run: mvn -B -ntp clean verify

      - name: Validate reports and documentation sources
        shell: bash
        run: |
          test -f target/site/jacoco/index.html
          test -f target/site/jacoco/jacoco.xml
          test -f target/openapi-docs/index.html
          required_guide_pages=(index.html getting-started.html docker.html api-documentation.html testing.html coverage.html ci-cd.html troubleshooting.html)
          for page in "${required_guide_pages[@]}"; do
            test -f "docs/user-guide/${page}"
          done

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker image
        run: docker compose build app

      - name: Generate Maven site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mvn -B -ntp site

      - name: Assemble GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          rm -rf pages
          mkdir -p pages/openapi pages/maven-site pages/coverage pages/badges
          cp -R docs/. pages/
          cp -R target/openapi-docs/. pages/openapi/
          rm -rf pages/openapi/.openapi-generator pages/openapi/.openapi-generator-ignore
          cp -R target/site/. pages/maven-site/
          rm -rf pages/maven-site/jacoco
          cp -R target/site/jacoco/. pages/coverage/
          set -o pipefail
          line_counter=$(grep -o '<counter type="LINE"[^>]*/>' target/site/jacoco/jacoco.xml | tail -n 1)
          covered=$(sed -n 's/.*covered="\([0-9]*\)".*/\1/p' <<< "$line_counter")
          missed=$(sed -n 's/.*missed="\([0-9]*\)".*/\1/p' <<< "$line_counter")
          test -n "$covered"
          test -n "$missed"
          total=$((covered + missed))
          test "$total" -gt 0
          coverage=$(awk -v covered="$covered" -v total="$total" 'BEGIN { printf "%.2f", (covered * 100) / total }')
          color=$(awk -v coverage="$coverage" 'BEGIN { if (coverage >= 90) print "brightgreen"; else if (coverage >= 80) print "green"; else if (coverage >= 70) print "yellow"; else print "red" }')
          printf '{\n  "schemaVersion": 1,\n  "label": "coverage",\n  "message": "%s%%",\n  "color": "%s"\n}\n' "$coverage" "$color" > pages/badges/coverage.json
          test -f pages/index.html
          required_guide_pages=(index.html getting-started.html docker.html api-documentation.html testing.html coverage.html ci-cd.html troubleshooting.html)
          for page in "${required_guide_pages[@]}"; do
            test -f "pages/user-guide/${page}"
          done
          test -f pages/openapi/index.html
          test -f pages/coverage/index.html
          test -f pages/maven-site/index.html
          test -f pages/badges/coverage.json

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify-build-publish

    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
